plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories {
    mavenCentral()
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

group = project.mod_group_id
version = project.mod_version
base { archivesName = project.mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = "gameTestServer" }
    }
    mods {
        matter_manipulator_modern { sourceSet(sourceSets.main) }
    }
}

tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, loader_version_range: loader_version_range
    ]
    inputs.properties(props)
    expand(props)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir(tasks.named('generateModMetadata'))
neoForge.ideSyncTask tasks.named('generateModMetadata')
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
